name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and docs dependencies
        run: pip install -e ".[docs]"

      - name: Write CI MkDocs config (site_url for project pages)
        run: |
          cat > mkdocs.ci.yml <<EOF
          INHERIT: mkdocs.github.yml
          site_url: https://${{ github.repository_owner }}.github.io/Timeries/
          repo_url: https://github.com/${{ github.repository }}
          edit_uri: edit/${{ github.ref_name }}/docs/
          EOF

      - name: Build MkDocs site
        run: mkdocs build --config-file mkdocs.ci.yml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
