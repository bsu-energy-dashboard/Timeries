name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and docs dependencies
        run: pip install -e ".[docs]"

      - name: Write CI MkDocs config (site_url for project pages)
        run: |
          cat > mkdocs.ci.yml <<EOF
          INHERIT: mkdocs.github.yml
          site_url: https://${{ github.repository_owner }}.github.io/Timeries/
          repo_url: https://github.com/${{ github.repository }}
          edit_uri: edit/main/docs/
          EOF

      - name: Deploy to gh-pages branch
        run: mkdocs gh-deploy --config-file mkdocs.ci.yml --force
